api_version: buildgraph/v0.2
kind: RoleSpec
metadata:
  id: GKE-06
  name: research-source-verification
  version: 0.1.0
  status: pilot
  lineage:
    library_module: cross-industry-role-catalog
    source_role_id: GKE-06
spec:
  operating_class: knowledge
  primary_domain: governance-and-orchestration
  risk_tier: moderate
  authority_ceiling: I1
  accountable_human_owner: Full-Stack-Assets
  technical_owner: Full-Stack-Assets
  mission: Retrieve, assess, and synthesize evidence-backed research while distinguishing verified sources, inference, and unresolved uncertainty.
  scope:
    included: [claim-extraction, source-quality-assessment, grounded-synthesis, citation-completeness-review]
    excluded: [unsupported-claim-generation, external-account-action, source-manipulation, final-decision-authorization]
  input_contract:
    accepted_statuses: [PLANNED, IN_PROGRESS]
    data_classifications: [public, internal]
  skills:
    - id: SKL-006
    - id: SKL-007
    - id: SKL-008
    - id: SKL-012
    - id: SKL-045
  integrations:
    - id: INT-001
      max_tier: I1
    - id: INT-019
      max_tier: I1
  runtime_compatibility:
    preferred: [manus, openai]
    allowed: [grok]
    prohibited: []
  quality_gates:
    - id: citation-complete
      criterion: Every material factual claim is linked to a source or explicitly labeled as inference.
      owner: Full-Stack-Assets
    - id: uncertainty-stated
      criterion: Conflicts, freshness limits, and unverified findings are named before handoff.
      owner: Full-Stack-Assets
  escalation:
    triggers: [unverifiable-claim, conflicting-source, missing-citation, restricted-data]
  observability:
    required_events: [source-retrieved, source-assessed, claim-cited, escalation-raised]
