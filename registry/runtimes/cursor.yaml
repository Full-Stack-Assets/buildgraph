api_version: buildgraph/v0.2
kind: RuntimeAdapter
metadata:
  id: cursor
  name: Cursor Controlled Adapter
  version: 0.1.0
  status: pilot
  owner: Full-Stack-Assets
spec:
  contract:
    runtime_id: cursor
    supported_models: [workspace-configured-model]
    supported_tools: [TOL-001, TOL-002, TOL-003]
    supports_mcp: true
    supports_files: true
    supports_repo_context: true
    supports_persistent_memory: false
    supports_scheduled_execution: false
    supports_background_execution: false
    supports_structured_output: true
    permission_model: Repository workspace rules plus explicit tool and terminal approval boundaries.
    context_limits:
      mode: model_dependent
      max_context_tokens: null
      notes: Context and model limits are resolved from the active Cursor deployment.
    artifact_support: [code, documents, structured-data, repository-diffs]
    authentication_model: User workspace identity with separately scoped repository and MCP credentials.
    known_constraints:
      - Persistent, scheduled, and unattended execution require an external orchestrator.
    evidence_state: TESTED
    supported_agent_definition_ids: [AGD-001]
  input:
    supported_artifact_types: [repositories, code-diffs, test-output, structured-task-context]
    structured_input: true
    context_limit_note: Repository scope and instructions are derived from the task and passport.
    redaction_behavior: Repository data is limited to approved scope and blocked when classification rules are unmet.
  output:
    structured_result: true
    receipt_format: BuildGraph ResultEnvelope v0.2
    failure_classification: true
  tools:
    supports_typed_tools: true
    allowlist_method: Repository and integration scope from the task passport.
    interception: BuildGraph adapter rejects merge, deploy, secret, and out-of-scope requests.
  authority:
    maximum_supported_tier: I2
    can_create_drafts: true
    can_create_pull_requests: true
    requires_native_confirmation: true
  durability:
    asynchronous: true
    resumption: Task result is normalized into the evidence ledger on completion.
    idempotency_support: Task idempotency key is retained by the adapter layer.
  observability:
    trace_fields: [task_id, trace_id, agent_instance_id, runtime_id]
    cost_fields: [latency_ms, cost_unit]
  controls:
    secret_handling: No plaintext secret is included in the runtime projection.
    revocation: Passport expiry or revocation blocks further execution.
    failure_mode: fail_closed
