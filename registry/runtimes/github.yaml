api_version: buildgraph/v0.2
kind: RuntimeAdapter
metadata:
  id: github
  name: GitHub Controlled Adapter
  version: 0.1.0
  status: pilot
  owner: Full-Stack-Assets
spec:
  contract:
    runtime_id: github
    supported_models: [not-applicable]
    supported_tools: [TOL-001, TOL-003]
    supports_mcp: false
    supports_files: true
    supports_repo_context: true
    supports_persistent_memory: false
    supports_scheduled_execution: true
    supports_background_execution: true
    supports_structured_output: true
    permission_model: Repository and workflow permissions constrained by branch protection and environment rules.
    context_limits:
      mode: deployment_defined
      max_context_tokens: null
      notes: Context is bounded by checked-out repository content, workflow inputs, and artifact retention.
    artifact_support: [code, repository-diffs, checks, workflow-artifacts, structured-data]
    authentication_model: GitHub App, workflow token, or user authorization scoped to repository and environment.
    known_constraints:
      - GitHub is an execution and system-of-record adapter rather than a frontier-model runtime.
    evidence_state: TESTED
    supported_agent_definition_ids: []
  input:
    supported_artifact_types: [repositories, code-diffs, pull-requests, continuous-integration-output]
    structured_input: true
    context_limit_note: Repository and workflow context are limited to approved references.
    redaction_behavior: Repository data is limited to approved scope and blocked when classification rules are unmet.
  output:
    structured_result: true
    receipt_format: BuildGraph ResultEnvelope v0.2
    failure_classification: true
  tools:
    supports_typed_tools: true
    allowlist_method: Repository and integration scope from the task passport.
    interception: BuildGraph adapter rejects protected-branch merge, deployment, secret, and out-of-scope requests.
  authority:
    maximum_supported_tier: I2
    can_create_drafts: true
    can_create_pull_requests: true
    requires_native_confirmation: true
  durability:
    asynchronous: true
    resumption: Task result is normalized into the evidence ledger on completion.
    idempotency_support: Task idempotency key is retained by the adapter layer.
  observability:
    trace_fields: [task_id, trace_id, agent_instance_id, runtime_id]
    cost_fields: [latency_ms, cost_unit]
  controls:
    secret_handling: No plaintext secret is included in the runtime projection.
    revocation: Passport expiry or revocation blocks further execution.
    failure_mode: fail_closed
