api_version: buildgraph/v1
kind: ProviderSpec
metadata:
  id: PRV-001
  name: OpenAI
  version: 1.0.0
  status: active
  owner: Full-Stack-Assets
spec:
  purpose: Supply model and agent runtimes through environment-specific adapters while canonical definitions remain provider neutral.
  runtime_ids: [openai, codex]
