api_version: buildgraph/v0.2
kind: ProjectSpec
metadata:
  id: buildgraph-core
  name: BuildGraph Core
  version: 0.1.0
  status: active
  owner: Full-Stack-Assets
spec:
  portfolio_id: full-stack-assets
  purpose: Implement and validate the private BuildGraph v0 registry, governance contracts, policy packs, and controlled runtime adapter interfaces.
  domain: governance-and-orchestration
  capability_ids: [CAP-002, CAP-003, CAP-009, CAP-010]
  factory_ids: [FAC-001]
  project_specific_role_ids: []
  canonical_role_ids: [ESP-01, ESP-03, GKE-03, GKE-04, GKE-05, GKE-06]
  policy_ids: [risk-tier-policy, approval-policy, data-handling-policy, release-policy]
  runtime_preferences: [codex, cursor, openai, local]
  repositories: [https://github.com/Full-Stack-Assets/buildgraph]
  evidence_requirements:
    - Preflight decision and payload hash exist before new canonical entities are created.
    - Registry, graph, tests, typecheck, and lint pass before release.
    - Generated artifacts have checksums and independent verification records.
  systems_of_record:
    - system: GitHub
      purpose: Source code, schema, policy, manifest, and CI provenance.
      authority: canonical
    - system: BuildGraph registry
      purpose: Canonical role, skill, integration, policy, and workflow manifest state.
      authority: canonical
    - system: ClickUp or Linear
      purpose: Human work planning and exception coordination when explicitly mapped.
      authority: work_queue
  authority:
    maximum_integration_tier: I2
    approval_policy_ref: approval-policy
  data_handling:
    permitted_classifications: [public, internal, confidential]
    retention_policy_ref: data-handling-policy
