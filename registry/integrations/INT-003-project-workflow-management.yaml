api_version: buildgraph/v0.2
kind: IntegrationSpec
metadata:
  id: INT-003
  name: project-workflow-management
  version: 0.1.0
  status: sandbox
spec:
  system: governed project and workflow management
  owners:
    system: Full-Stack-Assets
    technical: Full-Stack-Assets
    business_data: Full-Stack-Assets
  approved_roles: [GKE-03, GKE-05, ESP-01, ESP-03]
  environment: sandbox
  permission_tier: I2
  authentication:
    method: connector_reference
    credential_reference: managed-connector/project-workflow-sandbox
  data_classifications: [public, internal, confidential]
  scopes:
    - object: role-owned tasks and dependencies
      operations: [read, draft_write]
      field_constraints: [role-owned task scope only, no portfolio budget edit, no approval override]
  prohibited_actions: [change portfolio scope, change budget, silently alter deadline, execute approval, delete work records]
  human_confirmation:
    required_for: [portfolio scope change, budget change, approval state change]
  logging:
    audit_destination: buildgraph-evidence-ledger
    retention: project-defined work metadata retention
  monitoring:
    alerts: [permission-denied, unexpected-scope-change, unauthorized-status-transition, connector-failure]
  failure_behavior:
    fail_closed: true
    escalation_contact: Full-Stack-Assets
