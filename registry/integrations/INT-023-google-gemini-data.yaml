api_version: buildgraph/v0.2
kind: IntegrationSpec
metadata:
  id: INT-023
  name: google-gemini-data
  version: 1.1.0
  status: sandbox
spec:
  system: Google Gemini Files, File Search, and Interactions APIs
  owners:
    system: Full-Stack-Assets
    technical: Full-Stack-Assets
    business_data: Full-Stack-Assets
  approved_roles: [GKE-05, GKE-06, ESP-01]
  environment: sandbox
  permission_tier: I2
  authentication:
    method: service_identity
    credential_reference: runtime-secret/GEMINI_API_KEY
  data_classifications: [public, internal, confidential]
  scopes:
    - object: explicitly configured Gemini Files and File Search stores
      operations: [read, draft_write]
      field_constraints: [store allowlist validated before upload, resumable immutable upload, terminal import-operation status, bounded bytes, action grant and fail-closed idempotency required]
    - object: retrieval-scoped Gemini inference
      operations: [read]
      field_constraints: [configured model and File Search stores only, inference kill switch, expiring inference grant, provider storage disabled]
  prohibited_actions: [consumer chat-history scraping, file deletion, store deletion, credential management, unrestricted model tools, approval self-issuance]
  human_confirmation:
    required_for: [credential expansion, store scope expansion, destructive provider action, production activation]
    approval_record_reference: buildgraph/ApprovalRecord
  logging:
    audit_destination: canon-data-adapter-evidence-ledger
    retention: project-defined metadata, hash, receipt, citation, and approved content retention
  monitoring:
    alerts: [authentication-failure, authorization-failure, store-scope-violation, file-expiration-risk, rate-limit-saturation, connector-failure]
  failure_behavior:
    fail_closed: true
    escalation_contact: Full-Stack-Assets
