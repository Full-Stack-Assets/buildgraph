api_version: buildgraph/v0.2
kind: IntegrationSpec
metadata:
  id: INT-007
  name: code-repository-ci
  version: 0.1.0
  status: sandbox
spec:
  system: governed code repositories and continuous integration
  owners:
    system: Full-Stack-Assets
    technical: Full-Stack-Assets
    business_data: Full-Stack-Assets
  approved_roles: [GKE-04, ESP-01, ESP-03]
  environment: sandbox
  permission_tier: I2
  authentication:
    method: connector_reference
    credential_reference: managed-connector/github-scoped-project-access
  data_classifications: [public, internal, confidential]
  scopes:
    - object: approved repository, branch, pull request, and CI check context
      operations: [read, draft_write]
      field_constraints: [branch-level write only, isolated CI sandbox, no protected-branch merge, no production secrets]
  prohibited_actions: [merge protected branch, production deploy, access production secret, change branch protection, delete repository]
  human_confirmation:
    required_for: [protected-branch merge, production deployment, release publication, secret access]
  logging:
    audit_destination: buildgraph-evidence-ledger
    retention: repository and CI references with task and artifact linkage
  monitoring:
    alerts: [protected-action-attempt, secret-access-attempt, ci-failure, permission-denied]
  failure_behavior:
    fail_closed: true
    escalation_contact: Full-Stack-Assets
