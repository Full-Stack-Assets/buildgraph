api_version: buildgraph/v0.2
kind: IntegrationSpec
metadata:
  id: INT-022
  name: xai-grok-data
  version: 1.1.0
  status: sandbox
spec:
  system: xAI Grok Files, Collections, and Responses APIs
  owners:
    system: Full-Stack-Assets
    technical: Full-Stack-Assets
    business_data: Full-Stack-Assets
  approved_roles: [GKE-05, GKE-06, ESP-01]
  environment: sandbox
  permission_tier: I2
  authentication:
    method: service_identity
    credential_reference: runtime-secret/XAI_API_KEY-and-XAI_MANAGEMENT_API_KEY
  data_classifications: [public, internal, confidential]
  scopes:
    - object: explicitly configured xAI API files and collections
      operations: [read, draft_write]
      field_constraints: [collection allowlist validated before upload, immutable upload only, terminal collection-processing status, bounded file bytes, action grant and fail-closed idempotency required]
    - object: retrieval-scoped Grok inference
      operations: [read]
      field_constraints: [configured model and collection references only, inference kill switch, expiring inference grant, provider storage disabled]
  prohibited_actions: [consumer chat-history scraping, file deletion, collection deletion, credential management, unrestricted model tools, approval self-issuance]
  human_confirmation:
    required_for: [credential expansion, collection scope expansion, destructive provider action, production activation]
    approval_record_reference: buildgraph/ApprovalRecord
  logging:
    audit_destination: canon-data-adapter-evidence-ledger
    retention: project-defined metadata, hash, receipt, and approved content retention
  monitoring:
    alerts: [authentication-failure, authorization-failure, collection-scope-violation, rate-limit-saturation, cursor-stall, connector-failure]
  failure_behavior:
    fail_closed: true
    escalation_contact: Full-Stack-Assets
