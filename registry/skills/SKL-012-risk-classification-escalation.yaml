api_version: buildgraph/v0.2
kind: SkillSpec
metadata:
  id: SKL-012
  name: risk-classification-escalation
  version: 0.1.0
  status: pilot
  owner: Full-Stack-Assets
spec:
  purpose: Classify task, artifact, data, integration, and requested-action risk, then route uncertainty or consequential conditions to the named owner.
  inputs: [task context, requested authority, data classification, policy pack]
  outputs: [risk tier, rationale, control requirements, escalation record]
  limitations: [does not downgrade policy, does not grant authority, does not execute restricted action]
  allowed_runtimes: [manus, openai, cursor]
  tool_restrictions: [no action-capable integration is required]
  evaluation:
    fixtures: [fixtures/skills/SKL-012-low-risk.yaml, fixtures/skills/SKL-012-restricted-action.yaml]
    acceptance_criteria: [highest applicable risk is selected, uncertainty escalates, required controls are named]
    regression_threshold: No restricted action is classified below high risk.
  escalation:
    triggers: [unknown-risk, restricted-action, authority-conflict, data-risk]
