api_version: buildgraph/v0.2
kind: SkillSpec
metadata:
  id: SKL-013
  name: requirements-acceptance-criteria-authoring
  version: 0.1.0
  status: pilot
  owner: Full-Stack-Assets
spec:
  purpose: Convert approved objectives into testable requirements, constraints, non-goals, acceptance criteria, and named decision boundaries.
  inputs: [approved objective, stakeholder context, source references]
  outputs: [requirements set, acceptance criteria, non-goals, open decisions]
  limitations: [does not change project scope, does not commit budget or schedule, does not approve implementation]
  allowed_runtimes: [manus, openai, cursor]
  tool_restrictions: [no external action tool is required]
  evaluation:
    fixtures: [fixtures/skills/SKL-013-product-brief.yaml]
    acceptance_criteria: [requirements are testable, non-goals are explicit, decision owner is named]
    regression_threshold: No acceptance criterion remains untestable in reviewed fixtures.
  escalation:
    triggers: [scope-conflict, missing-decision-owner, contradictory-requirement]
