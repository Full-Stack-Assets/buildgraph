name: Gemini credential canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run tests/canon-mcp-gateway-policy.test.ts
      - name: Verify Gemini credential with one metadata result
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/gemini-canary.ts
